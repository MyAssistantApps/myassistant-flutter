name: Tester build

# Every push builds a release-signed APK and sends it through Firebase App
# Distribution:
#   hardening       → the "testers" group
#   hardening-test  → the owner only (dhanushinsit@gmail.com)
# The build number is 200 + the run number, so each build installs as an
# update over the last one (pubspec's +N is only for local builds).
#
# Secrets (repo settings → Secrets → Actions):
#   RELEASE_KEYSTORE_BASE64   base64 of hari-release.jks
#   RELEASE_KEY_PROPERTIES    android/key.properties, storeFile=hari-release.jks
#   GOOGLE_SERVICES_JSON      android/app/google-services.json
#   APP_CHECK_DEBUG_TOKEN     the registered App Check debug token
#   FIREBASE_SERVICE_ACCOUNT  service-account JSON with App Distribution access

on:
  push:
    branches: [hardening, hardening-test]
  workflow_dispatch:

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_ID: "1:134941649419:android:1cf295485ff4efbc0af50e"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5" # same as ci.yml
          channel: stable
          cache: true

      - name: Signing, Firebase config and App Check token
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.RELEASE_KEY_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for v in KEYSTORE_B64 KEY_PROPERTIES GOOGLE_SERVICES_JSON FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is missing"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "$KEYSTORE_B64" | base64 -d > android/app/hari-release.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          if [ -n "$APP_CHECK_DEBUG_TOKEN" ]; then
            printf '%s' "$APP_CHECK_DEBUG_TOKEN" > android/app-check-debug-token.txt
          else
            echo "::warning::APP_CHECK_DEBUG_TOKEN not set — Firebase AI Logic will refuse this build"
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - run: flutter pub get

      - name: Build APK
        run: BUILD_NUMBER=$((200 + GITHUB_RUN_NUMBER)) tool/build_apk.sh

      - name: The APK must carry the release signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::The APK is debug-signed — testers' installed copies could not update to it."
            exit 1
          fi

      - name: Send to App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          if [ "$GITHUB_REF_NAME" = "hardening" ]; then
            TARGET=(--groups testers)
          else
            TARGET=(--testers dhanushinsit@gmail.com)
          fi
          git log -1 --format='%h %s' > notes.txt
          echo "branch $GITHUB_REF_NAME · build $((200 + GITHUB_RUN_NUMBER))" >> notes.txt
          npx --yes firebase-tools@latest appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes-file notes.txt \
            "${TARGET[@]}"

      - name: Remove secrets from the runner
        if: always()
        run: rm -f android/app/hari-release.jks android/key.properties android/app-check-debug-token.txt "$RUNNER_TEMP/firebase-sa.json"
