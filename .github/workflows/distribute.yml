name: Tester build

# Every push builds an APK signed with the TEAM DEBUG KEY (SHA-1 39:03:80:…,
# the "MyAssistant debug.keystore (base64)" Bitwarden note — the original
# release key is lost) and sends it through Firebase App
# Distribution — TO THE OWNER ONLY for now (owner, 2026-11-01: "don't
# push to real users, I want the app only for me now to testing"):
#   hardening, hardening-test → dhanushinsit@gmail.com
# To send hardening builds to the "testers" group again, set the repo
# variable SEND_TO_TESTERS=yes (Settings → Secrets and variables →
# Actions → Variables). Nothing else changes.
# The build number is 200 + the run number, so each build installs as an
# update over the last one (pubspec's +N is only for local builds).
#
# Secrets (repo settings → Secrets → Actions):
#   DEBUG_KEYSTORE_BASE64     base64 of the team debug.keystore
#   GOOGLE_SERVICES_JSON      android/app/google-services.json
#   APP_CHECK_DEBUG_TOKEN     the registered App Check debug token
#   FIREBASE_SERVICE_ACCOUNT  service-account JSON with App Distribution access

on:
  push:
    branches: [hardening, hardening-test]
  workflow_dispatch:

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_ID: "1:134941649419:android:1cf295485ff4efbc0af50e"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5" # same as ci.yml
          channel: stable
          cache: true

      - name: Signing, Firebase config and App Check token
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for v in KEYSTORE_B64 GOOGLE_SERVICES_JSON FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is missing"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          # Sign with the team debug key through android/key.properties
          # (git-ignored). Copying it to ~/.android/debug.keystore was NOT
          # enough: Gradle on the runner made and used a fresh debug key.
          # The passwords are Android's standard public debug ones.
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/team-debug.keystore"
          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/team-debug.keystore" \
            "storePassword=android" \
            "keyAlias=androiddebugkey" \
            "keyPassword=android" > android/key.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          if [ -n "$APP_CHECK_DEBUG_TOKEN" ]; then
            printf '%s' "$APP_CHECK_DEBUG_TOKEN" > android/app-check-debug-token.txt
          else
            echo "::warning::APP_CHECK_DEBUG_TOKEN not set — Firebase AI Logic will refuse this build"
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - run: flutter pub get

      - name: Build APK
        run: BUILD_NUMBER=$((200 + GITHUB_RUN_NUMBER)) tool/build_apk.sh

      - name: The APK must carry the team key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if ! grep -qi "SHA-1 digest: 3903808d51b762b3835fabc509635ab4d39a5e1d" certs.txt; then
            echo "::error::The APK is not signed with the team key (39:03:80:…) — installed copies could not update to it."
            exit 1
          fi

      # The same APK for the in-app updater (tool/publish_update.sh):
      # `gh run download <run> -n tester-apk` fetches it, so both channels
      # ship one identical binary and nobody has to build it again locally.
      - name: Keep the APK for the in-app updater
        uses: actions/upload-artifact@v4
        with:
          name: tester-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Send to App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          if [ "$GITHUB_REF_NAME" = "hardening" ] && [ "${{ vars.SEND_TO_TESTERS }}" = "yes" ]; then
            TARGET=(--groups testers)
          else
            TARGET=(--testers dhanushinsit@gmail.com)
          fi
          git log -1 --format='%h %s' > notes.txt
          echo "branch $GITHUB_REF_NAME · build $((200 + GITHUB_RUN_NUMBER))" >> notes.txt
          npx --yes firebase-tools@latest appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes-file notes.txt \
            "${TARGET[@]}"

      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/team-debug.keystore" android/key.properties android/app-check-debug-token.txt "$RUNNER_TEMP/firebase-sa.json"
