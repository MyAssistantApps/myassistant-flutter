# PREVIEW BUILD — an APK of any branch, for the owner's phone only. Never
# touches the live backend or testers.
#
#   gh workflow run preview.yml --ref production -f ref=<branch>
#
#   1. checks out <branch>, runs analyze + tests
#   2. versionCode = max(live, dev) + 1 — the release that follows uses the
#      same rule, so it always installs over a preview
#   3. builds with BASE_URL = the DEV backend (separate data, same team key)
#   4. publishes to the DEV backend: the phone installs it from
#      https://dev.189-72-146-77.sslip.io/app/latest.apk
#
# The file lives on production (that is where the signing secrets are
# allowed) and is listed in in-app-update.yml's paths-ignore, so changing it
# never releases anything.
name: preview build
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: true

concurrency:
  group: preview
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIVE: https://backend.envisionsit.in
  DEV: https://dev.189-72-146-77.sslip.io

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Signing and Firebase config
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEV_ADMIN_KEY: ${{ secrets.DEV_ADMIN_KEY }}
        run: |
          missing=0
          for v in KEYSTORE_B64 GOOGLE_SERVICES_JSON DEV_ADMIN_KEY; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is missing"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/team-debug.keystore"
          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/team-debug.keystore" \
            "storePassword=android" \
            "keyAlias=androiddebugkey" \
            "keyPassword=android" > android/key.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Next version number
        id: ver
        run: |
          code() { curl -fsS -m 20 "$1/config" | python3 -c 'import json,sys; print(int(json.load(sys.stdin).get("latestVersionCode") or 0))'; }
          live=$(code "$LIVE"); dev=$(code "$DEV")
          next=$(( (live > dev ? live : dev) + 1 ))
          name=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          echo "code=$next" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "→ preview $name ($next); live has $live, dev has $dev"

      - name: Build APK (points at the dev backend)
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --build-number=${{ steps.ver.outputs.code }} \
            --dart-define=BASE_URL=$DEV

      - name: The APK must carry the team key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          grep -qi "SHA-1 digest: 3903808d51b762b3835fabc509635ab4d39a5e1d" certs.txt || {
            echo "::error::APK not signed with the team key"; exit 1; }

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ steps.ver.outputs.code }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish to the dev backend
        env:
          ADMIN_KEY: ${{ secrets.DEV_ADMIN_KEY }}
        run: |
          line=$(git log -1 --format=%s | cut -c1-120)
          curl -fsS -m 600 \
            -H "X-Admin-Key: $ADMIN_KEY" \
            -F "apk=@build/app/outputs/flutter-apk/app-release.apk" \
            -F "versionCode=${{ steps.ver.outputs.code }}" \
            -F "versionName=${{ steps.ver.outputs.name }}" \
            -F "changelog=PREVIEW ${{ inputs.ref }}: $line" \
            "$DEV/admin/apk" > publish.json
          python3 -c 'import json; m=json.load(open("publish.json")); print("published", m.get("versionCode"))'
          echo "### Install on the phone: $DEV/app/latest.apk (build ${{ steps.ver.outputs.code }})" >> "$GITHUB_STEP_SUMMARY"
